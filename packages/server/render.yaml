services:
  - type: web
    name: gift-upgrader-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:shared && npm run db:push && npm run db:seed && npm run build:server
    startCommand: npm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: "*"
