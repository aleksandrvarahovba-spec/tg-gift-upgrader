services:
  - type: web
    name: gift-upgrader-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:shared && cd packages/server && npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts && npm run build
    startCommand: cd packages/server && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: BOT_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: "*"
